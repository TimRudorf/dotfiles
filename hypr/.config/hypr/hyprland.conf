# Catppuccin Mocha colors
source = ~/.config/hypr/mocha.conf

# Modular config files
source = ~/.config/hypr/vars.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/workspaces.conf
source = ~/.config/hypr/workspaces-generated.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/autostart.conf

# Screen sharing
env = XDG_CURRENT_DESKTOP,Hyprland

# Default-Browser für CLI-Tools, die $BROWSER auswerten
env = BROWSER,chromium

# Machine-specific overrides (GPU env vars, monitor layout, etc.)
# Create this file locally — it is gitignored.
source = ~/.config/hypr/local.conf
